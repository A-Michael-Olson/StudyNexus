<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Nexus</title>
    <link rel="stylesheet" href="../../styles/theme.css" />
    <link rel="stylesheet" href="../../styles/dashboard.css" />
    <link rel="stylesheet" href="../../styles/tasks.css" />
    <link rel="icon" type="image/png" href="../../images/StudyNexus.png">
</head>
<body>
    <!-- navigation header -->
    <nav id="header">
        <div class="nav-left">
            <button id="btn-toggle-sidebar" class="mobile-toggle">☰</button>

            <a href="../../index.html">
                <img class="nav-logo" src="../../images/StudyNexus.png" alt="Study Nexus">
            </a>
        </div>

        <div id="nav-group-info">
            <span id="nav-group-name">Group Name</span>
        </div>

        <div class="nav-right">
            <button type="button" id="theme-toggle">Toggle light/dark</button>
        </div>
    </nav>
    <div id="dashboard">
        <div id="left-sidebar">
            <!-- Channel Sidebar -->
            <article class="channel-sidebar">

                <div class="channels-header">
                    <h1>Channels</h1>
                    <button id="btn-add-channel" class="btn sidebar-btn">+ Add Channel</button>
                </div>
                <div id="channel-list"></div>

            </article>

            <!-- Task Sidebar -->
            <div class="channels-header">
                <h1>Tasks</h1>
                <button id="btn-add-task" class="btn sidebar-btn">+ Add Task</button>
            </div>
            <div class="task-columns">
                <div class="task-column">
                    <h2 class="task-toggle" data-status="active">
                        Active <span class="task-count"></span>
                    </h2>
                    <div class="task-list" id="active-tasks"></div>
                </div>

                <div class="task-column">
                    <h2 class="task-toggle" data-status="completed">
                        Completed <span class="task-count"></span>
                    </h2>
                    <div class="task-list" id="completed-tasks"></div>
                </div>
            </div>


        </div>

        <div id="group-content">
            <!-- Window for received/sent messages -->
            <div id="chat-content">
                <!-- <article class="message">
                    <p class="message-username">Example_Username</p>
                    <p class="message-content">Lorem Ipsum Delore Sit Amet</p>
                    <p class="message-time">hh:mm</p>
                </article>
                <article class="message self">
                    <p class="message-username">Example_Username</p>
                    <p class="message-content">Lorem Ipsum Delore Sit Amet</p>
                    <p class="message-time">hh:mm</p>
                </article>
                <article class="message">
                    <p class="message-username">Example_Username</p>
                    <p class="message-content">Lorem Ipsum Delore Sit Amet</p>
                    <p class="message-time">hh:mm</p>
                </article> -->
            </div>
            <div id="input-bar">
                <div class="textbox">
                    <textarea id="textbox-input" placeholder="Type a message..." rows="1"></textarea>
                </div>

                <div class="send-msg">
                    <button type="button" id="btn-send" class="btn">Send</button>
                </div>
            </div>
        </div>
        <div id="users-sidebar">
            <h2>Members</h2>
            
            <div id="user-list">
                <!-- <article class="user-item">
                    <div class="username-container">
                        <h3>Test_User_Name</h3>
                        <p class="tooltip-text">Tooltip_content</p>
                    </div>
                </article> -->
            </div>
            <div id="leave-group-container">
                <button id="btn-leave-group" class="btn danger">
                    Leave Group
                </button>
            </div>
        </div>

    </div>
    <div id="task-modal-overlay" class="modal-overlay">
        <div class="modal">
            <h2 id="modal-title">New Task</h2>

            <input id="task-title-input" placeholder="Task name"> 
            <textarea id="task-desc-input" placeholder="Description"></textarea>
            <input type="date" id="task-date-input">

            <label>
                <input type="checkbox" id="task-complete-input">
                Completed
            </label>

            <div class="modal-actions">
                <button id="btn-save-task" class="btn">Save</button>
                <button id="btn-close-task" class="btn">Cancel</button>
                <button id="btn-delete-task" class="btn danger">Delete</button>
            </div>
        </div>
    </div>
    <script type="module" src="../../scripts/dashboard.js"></script>
    <script type="module" src="../../scripts/toggle-dark.js"></script> <!-- Dark theme -->
</body>
</html>
