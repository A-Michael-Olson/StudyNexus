<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Nexus</title>
    <link rel="stylesheet" href="../../styles/theme.css" />
    <link rel="stylesheet" href="../../styles/dashboard.css" />
    <link rel="stylesheet" href="../../styles/tasks.css" />
    <link rel="icon" type="image/png" href="images/StudyNexus.png">
</head>
<body>
    <script>
        var dark_mode = false;
        var first_click = true;
        var root = document.querySelector(':root');
        // light theme init
        var light_bg_main      = "";
        var light_bg_card      = "";
        var light_bg_secondary = "";
        var light_text_primary = "";
        var light_shadow_soft  = "";
        function toggle_theme() {
            // fetch light theme (current)
            if (first_click) {
                console.log("first click")
                let style = window.getComputedStyle(document.body); 
                // get light theme through default current colors
                light_bg_main      = style.getPropertyValue("--bg-main");
                light_bg_card      = style.getPropertyValue("--bg-card");
                light_bg_secondary = style.getPropertyValue("--bg-secondary");
                light_text_primary = style.getPropertyValue("--text-primary");
                light_shadow_soft  = style.getPropertyValue("--shadow-soft");
                first_click = false;
                console.log("set light vars");
            }
            let root = document.querySelector(':root');

            if (dark_mode) {
                console.log("Setting light theme")
                // light mode
                
                root.style.setProperty("--bg-main",      light_bg_main);
                root.style.setProperty("--bg-card",      light_bg_card);
                root.style.setProperty("--bg-secondary", light_bg_secondary);
                root.style.setProperty("--text-primary", light_text_primary); 
                root.style.setProperty("--shadow-soft",  light_shadow_soft);
                dark_mode = false;
            } else {
                console.log("setting dark theme")
                // dark mode
                root.style.setProperty("--bg-main", "#151518");
                root.style.setProperty("--bg-card", "#151c2c");
                root.style.setProperty("--bg-secondary", "#000000");
                root.style.setProperty("--text-primary","#cecece"); 
                root.style.setProperty("--shadow-soft", "0 4px 10px rgba(56, 16, 158, 1)");

                dark_mode = true;
            }
        }
    </script>

    <!-- navigation header -->
    <nav id="header">
        <a href="../../index.html">
            <img class="nav-logo" src="../../images/StudyNexus.png" alt="Study Nexus">
        </a>

        <a class="nav-link" href="../../index.html">HOME</a>
        <a class="nav-link" href="../login/login.html">LOGIN</a>
        <a class="nav-link" href="../login/signup.html">SIGNUP</a>
        <a class="nav-link" href="../login/profilepage.html">PROFILE</a>
        <button type="button" id="theme-toggle" onclick="toggle_theme()">Toggle light/dark</button>
    </nav>
    <div id="dashboard">
        <div id="left-sidebar">
            <!-- Channel Sidebar -->
            <article class="channel-sidebar">
                <h1 id="channels-title">Channels Sidebar</h1>
                <div class="channel-list">
                    <!-- Various channels -->
                    <a>Channel 1</a>

                </div>
            </article>

            <!-- Task Sidebar -->
            <article class="task-items">
                <h1 id="tasks-title">Tasks</h1>
                <button id="btn-add-task" class="btn">Add Task</button>

                <div class="task-columns">
                    <div class="task-column">
                        <h2>Active</h2>
                        <div class="task-list" id="active-tasks"></div>
                    </div>

                    <div class="task-column">
                        <h2>Completed</h2>
                        <div class="task-list" id="completed-tasks"></div>
                    </div>
                </div>
            </article>


        </div>

        <div id="group-content">

            <div class="group-header">
                <h1 id="group-name">Group Name</h1>
                <p id="group-id-display"></p>
            </div>

            <!-- Window for received/sent messages -->
            <div id="chat-content"></div>

            <div id="input-bar">
                <div class="textbox">
                    <textarea id="textbox-input" placeholder="Type a message..." rows="1"></textarea>
                </div>

                <div class="send-msg">
                    <button type="button" id="btn-send">Send</button>
                </div>
            </div>
        </div>
        <div id="users-sidebar">
            <h2>Members</h2>
            <div id="user-list">
                <article class="user-item">
                    <img src="/images/studyNexus.png">
                    <h3>Test_User_Name</h3>
                </article>
            </div>
        </div>

    </div>
    <div id="task-modal-overlay" class="modal-overlay">
        <div class="modal">
            <h2 id="modal-title">New Task</h2>

            <input id="task-title-input" placeholder="Task name">
            <textarea id="task-desc-input" placeholder="Description"></textarea>
            <input type="date" id="task-date-input">

            <label>
                <input type="checkbox" id="task-complete-input">
                Completed
            </label>

            <div class="modal-actions">
                <button id="btn-save-task" class="btn">Save</button>
                <button id="btn-close-task" class="btn">Cancel</button>
                <button id="btn-delete-task" class="btn danger">Delete</button>
            </div>
        </div>
    </div>
     <script type="module" src="../../scripts/dashboard.js"></script>
</body>
</html>
