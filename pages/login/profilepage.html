<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page</title>
    <link rel="stylesheet" href="../../styles/theme.css">
    <link rel="stylesheet" href="../../styles/profilepage.css">
</head>
<body>
    <header>
        <nav>
            <div id="profileHeader">
                <img id="logo" src="../../images/StudyNexusLogo.png" alt="Study Nexus Logo">
                <div class="profile-photo">
                    <img id="profile-avatar" src="../../images/default-avatar.jpg" alt="Profile Photo" width="100" style="border-radius:50%;">
                    <input type="file" id="avatar-input" accept="image/*">
                    <button id="btn-upload-avatar" class="btn">Upload Photo</button>
                </div>
                <div class="username-row">
                    <h2 id="profile-user-name"></h2>
                    <button type="button" id="btn-change-group" class="btn btn-subtle">✏ Change Username</button>
                </div>
                <div class="logout-container">
                    <button id="btn-logout" class="btn btn-danger">Log Out</button>
                </div>
                <h2 id="profile-email"></h2>
                <div class="top-right">
                    <button type="button" class="btn" id="theme-toggle">Toggle light/dark</button>
                </div>
            </div>
        </nav>
    </header>
    <div class="groups-label">
        <h1>Your Groups:</h1>
    </div>
    <div id="user-groups"></div>
    <div class="user-change">
        <div class="group-join-box">
            <div class="group-input">
                <input id="group-input" placeholder="Enter Group Code...">
                <button type="button" id="btn-add-group" class="btn" onclick="">Add Group</button>
            </div>
        </div>
    </div>
    <script type="module" src="../../scripts/profilepage.js"></script>
    <script type="module" src="../../scripts/toggle-dark.js"></script> <!-- Dark theme -->
</body>
</html>
